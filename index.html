<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simvela — Səyahət üçün eSIM</title>
<meta name="description" content="Simvela ilə xaricdə internetsiz qalma. 190+ ölkə üçün eSIM, dəqiqələr içində quraşdırma.">
<link rel="stylesheet" href="assets/style.css">
<style>
  .hero { text-align: center; padding: 40px 0 20px; }
  .hero h1 { font-size: 34px; }
  .hero p { font-size: 17px; max-width: 480px; margin: 0 auto 28px; }
  .stores { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
  .store-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 20px; color: var(--ink); text-decoration: none; font-weight: 600;
  }
  .links-row {
    display: flex; gap: 20px; justify-content: center; margin-top: 40px;
    flex-wrap: wrap; font-size: 14px;
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="./">
    <div class="brand-mark">S</div>
    <div class="brand-name">Simvela</div>
  </a>

  <div class="hero">
    <h1>Xaricdə internetsiz qalma</h1>
    <p>190+ ölkə üçün eSIM — dəqiqələr içində quraşdır, səyahətin boyu qoşulu qal.</p>
    <div class="stores">
      <a class="store-btn" href="https://play.google.com/store/apps/details?id=az.simvela.app">Google Play-dən yüklə</a>
      <a class="store-btn" href="https://apps.apple.com/search?term=simvela">App Store-da axtar</a>
    </div>
  </div>

  <footer>
    <div class="links-row">
      <a href="privacy/">Məxfilik siyasəti</a>
      <a href="terms/">İstifadə şərtləri</a>
      <a href="delete-account/">Hesabın silinməsi</a>
      <a href="mailto:abishovazar@gmail.com">Əlaqə</a>
    </div>
  </footer>
</div>
</body>
</html>
