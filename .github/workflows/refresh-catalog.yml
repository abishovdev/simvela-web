# Hər gün kataloqu (ölkə + regional paketlər, qiymətlər) təzələyir və dəyişiklik varsa saytı yenidən qurub dərc edir.
# Əl ilə də işlətmək olar: GitHub → Actions → "Refresh plan catalog" → Run workflow.
name: Refresh plan catalog

on:
  schedule:
    - cron: '17 4 * * *'   # hər gün 04:17 UTC (Bakı 08:17)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch catalog and rebuild pages
        run: |
          node tools/fetch-catalog.mjs
          node tools/build.mjs
      - name: Commit and push if anything changed
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "simvela-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh plan catalog $(date -u +%F)"
          git push
